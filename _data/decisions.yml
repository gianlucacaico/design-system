# Decision log for the design system, shown on its Governance page.
# Add a line for every design decision Gianluca makes, newest first. Month and year only.
- when: Nov 2026
  decision: "Cards carry no decorative accent line. The plain card (white, a hairline border and soft corners, as on gianlucacaico.com's engagement cards) replaces the cards with a coloured top line, on both sites. A coloured edge stays only where it means something: the bracket that groups a subset, the outcome line inside a card and the pull quote."
  why: "The top lines were decoration. The site's own cards are simpler and read better, and the bracket's edge earns its place because it shows the cards inside belong to the role above."
- when: Nov 2026
  decision: "The design system becomes a portal: a home page that shows every page at a glance, in three groups, and eight short pages instead of one long one. The menu stays on screen, with a Menu button on phones, and every menu, the home page and the footer are built from one list (<code>_data/nav.yml</code>)."
  why: "The single page had reached 34 phone screens and was heading for about 60. People come to look one thing up, and a new page now takes one line to add."
- when: Nov 2026
  decision: "Pages two levels down show a breadcrumb trail in the glass pill: the same <code>.crumbs</code> component on gianlucacaico.com's posts and on this site's Workflows and Kit demo pages."
  why: "Readers who land deep from a shared link can see where they are and step up a level, and this site's pages show they belong to gianlucacaico.com."
- when: Nov 2026
  decision: "Each site's footer links to the other: gianlucacaico.com's footer now links here, and this site's footer links back. This replaces \"no links from the main site\"."
  why: "Visitors to either site can find the other, and a footer link doesn't pull attention from the Work page, which was the reason for keeping them apart."
- when: Nov 2026
  decision: "The docs page opens with the operating model for executives and sponsors, shown through two real changes traced end to end, ahead of Foundations."
  why: "Leaders need the outcome and the way of working in under a minute. A real change with its record shows that better than a diagram of the process."
- when: Nov 2026
  decision: "Every footer carries a small site map. Here: this site's sections, its pages and gianlucacaico.com's main pages. On gianlucacaico.com: its pages, homepage sections and newest posts."
  why: "The end of a long page offers a way on without scrolling back up, and both sites use the same pattern."
- when: Nov 2026
  decision: "The site and the design system check each other: the site reads the design system's tokens, and the design system reads the site's stylesheet."
  why: "A difference is caught whichever side changes first, and each report says what the other side needs to do."
- when: Nov 2026
  decision: "Client names are written as text on project cards, not shown as logos."
  why: "There is no formal permission from the clients to show their logos."
- when: Nov 2026
  decision: "The brighter artwork cyan is its own token, <code>--cyan-bright</code> (#12B5CB)."
  why: "It kept clashing with the site's <code>--cyan</code> (#0E97AA) in the artwork template."
- when: Nov 2026
  decision: "Pictogram highlights use three tints: <code>--tint-cyan</code>, <code>--tint-coral</code> and <code>--tint-amber</code>."
  why: "They were already in the site's pictograms but were not tokens anywhere."
- when: Nov 2026
  decision: "The kit is served as version 1. Breaking changes become version 2, at their own address."
  why: "Pages that use the kit should never break without warning."
- when: Nov 2026
  decision: "A drift check compares the kit with the live site, at the end of every preview."
  why: "The kit is a copy of the site's styles, so it has to be told when the site changes."
- when: Nov 2026
  decision: "The design system lives in its own repo, at gianlucacaico.com/design-system, with no links from the main site."
  why: "As a page under Work it distracted from the Work page's purpose, and on its own it can never break the main site."
- when: Nov 2026
  decision: "The kit's dark surface is derived from ink and the site's on-dark colours."
  why: "The main site has no dark mode of its own to copy."
